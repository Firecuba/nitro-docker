server {
    listen 8086 ssl;
    server_name atom.firecuba.com;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # catalog-panel has no auth of its own and can directly edit the live
    # catalog, so it's gated behind HTTP basic auth at the proxy layer.
    auth_basic "Atom Catalog Panel";
    auth_basic_user_file /etc/nginx/tls/catalog_panel.htpasswd;

    location / {
        proxy_pass http://catalog-panel:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
