x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  arcturus:
    build:
      context: arcturus
    env_file:
      - .env
    volumes:
      - ./assets/:/app/assets/
      - /mnt/nvme/atom-data/assets-swf:/app/assets/swf
      - ./tls/cert.pem:/app/ssl/cert.pem:ro
      - ./tls/privkey.pem:/app/ssl/privkey.pem:ro
    ports:
      #- 3000:3000 # gameport
      #- 3001:3001 # rcon
      - 2096:2096 # websocket port
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [nitro]
    logging: *default-logging
    mem_limit: 512m

  nitro:
    build:
      context: nitro
    env_file:
      - .env
    volumes:
      - ./nitro/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nitro/renderer-config.json:/usr/share/nginx/html/renderer-config.json
      - ./nitro/ui-config.json:/usr/share/nginx/html/ui-config.json
    restart: unless-stopped
    networks: [nitro]
    logging: *default-logging
    mem_limit: 64m

  db:
    image: mysql:8
    depends_on:
      - backup
    env_file:
      - .env
    ports:
      - 127.0.0.1:3310:3306
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/dumps:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks: [nitro]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *default-logging
    mem_limit: 768m

  backup:
    image: tiredofit/db-backup:4.0.19
    volumes:
      - ./db/backup:/backup
    environment:
      - TIMEZONE=UTC
      - CONTAINER_ENABLE_MONITORING=FALSE
      - DEFAULT_LOG_LEVEL=WARN

      - DEFAULT_CREATE_LATEST_SYMLINK=FALSE
      - BACKUP_JOB_CONCURRENCY=1
      - DEFAULT_CHECKSUM=SHA1
      - DEFAULT_COMPRESSION=GZ
      - DEFAULT_BACKUP_INTERVAL=1440
      - DEFAULT_BACKUP_BEGIN=0315
      - DEFAULT_CLEANUP_TIME=10080

      - DB01_TYPE=mysql
      - DB01_HOST=db
      - DB01_NAME=$MYSQL_USER
      - DB01_USER=$MYSQL_USER
      - DB01_PASS=$MYSQL_PASSWORD
      - DB01_NAME=$MYSQL_DATABASE
    restart: unless-stopped
    networks: [nitro]
    logging: *default-logging
    mem_limit: 128m

  assets:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - imager
      - imgproxy
    env_file:
      - .env
    volumes:
      - ./assets/nginx:/etc/nginx/conf.d/
      - ./assets/:/usr/share/nginx/html
      - /mnt/nvme/atom-data/assets-swf:/usr/share/nginx/html/swf
    networks: [nitro]
    logging: *default-logging
    mem_limit: 128m

  tls-proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - cms
      - nitro
      - assets
    ports:
      - "8085:8085"
      - "8084:8084"
      - "8083:8083"
    volumes:
      - ./tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ./tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro
    networks: [nitro]
    logging: *default-logging
    mem_limit: 64m

  imager:
    build:
      context: imager
    env_file:
      - .env
    volumes:
      - ./assets/:/app/assets/
      - /mnt/nvme/atom-data/assets-swf:/app/assets/swf
    restart: unless-stopped
    networks: [nitro]
    logging: *default-logging
    mem_limit: 256m

  imgproxy:
    image: ghcr.io/willnorris/imageproxy
    volumes:
      - "./assets/usercontent/imageproxy/cache:/tmp/imageproxy"
    env_file:
      - .env
    restart: unless-stopped
    networks: [nitro]
    logging: *default-logging
    mem_limit: 128m

  cms:
    build:
      context: atomcms
    depends_on:
      assets:
        condition: service_started
      arcturus:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - "./.cms.env:/var/www/html/.env"
      - "./atomcms/storage:/var/www/html/storage/app/public"
      - "./atomcms/logs:/var/www/html/storage/logs"
      - "./atomcms/gamedata:/var/www/html/public/gamedata"
    restart: unless-stopped
    networks: [nitro]
    logging: *default-logging
    mem_limit: 256m

networks:
  nitro:
